# Loki, single binary, filesystem storage: one pod, enough for a laptop.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef: { kind: HelmRepository, name: grafana }
  values:
    fullnameOverride: loki
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig: { replication_factor: 1 }
      storage: { type: filesystem }
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: { prefix: index_, period: 24h }
      limits_config:
        ingestion_rate_mb: 32
        ingestion_burst_size_mb: 64
    singleBinary:
      replicas: 1
      nodeSelector: { pool: monitoring }
      tolerations: [{ key: pool, operator: Equal, value: monitoring, effect: NoSchedule }]
      persistence: { size: 5Gi }
    read: { replicas: 0 }
    write: { replicas: 0 }
    backend: { replicas: 0 }
    gateway: { enabled: false }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
    lokiCanary: { enabled: false }
    test: { enabled: false }
