# The only thing applied by hand (`make flux-sync`). From here on Flux pulls everything else from Git.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ticketrush
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/huseyinbabal/high-performance-spring-data   # public: no deploy key needed
  ref: { branch: main }
  ignore: |
    /*
    !/session-05-production/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m
  path: ./session-05-production/deploy/clusters/kind
  prune: true
  sourceRef: { kind: GitRepository, name: ticketrush }
