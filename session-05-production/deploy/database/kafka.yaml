apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app: kafka }
  ports: [{ name: client, port: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # The image turns every KAFKA_* variable into broker config. Service links would inject KAFKA_PORT=tcp://…
      # into the pod and break the broker, so they are switched off.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.0.0          # KRaft — no ZooKeeper
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # Clients connect to the address a broker ADVERTISES: the Service's DNS name
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.database.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          ports: [{ containerPort: 9092 }]
          # A TCP check, not `kafka-topics.sh --list`: the client would follow the ADVERTISED address — this very
          # Service — which has no endpoints until the pod is ready. The probe could never pass.
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 1Gi }
