apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }      # local demo only
            - { name: ES_JAVA_OPTS, value: -Xms1g -Xmx1g }
            # laptops with a >90% full Docker disk would otherwise refuse to allocate the index
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
          ports: [{ containerPort: 9200 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "curl -s localhost:9200/_cluster/health | grep -q -E 'green|yellow'"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 2Gi }
          volumeMounts: [{ name: data, mountPath: /usr/share/elasticsearch/data }]
      volumes:
        - name: data
          emptyDir: {}                  # the index is rebuilt from PostgreSQL with `make reindex`
