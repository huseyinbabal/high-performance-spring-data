# Three layers, applied in order:  database ─┐
#                                 monitoring ─┴─> apps
# `wait: true` = a layer is Ready only when every object in it is healthy, so apps never start against a half-seeded DB.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 10m
  path: ./session-05-production/deploy/database
  prune: true
  wait: true
  timeout: 15m                          # the first start seeds ~1.6M rows
  sourceRef: { kind: GitRepository, name: ticketrush }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./session-05-production/deploy/monitoring
  prune: true
  wait: true
  timeout: 15m
  sourceRef: { kind: GitRepository, name: ticketrush }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - { name: database }
    - { name: monitoring }              # the PodMonitor CRD comes with kube-prometheus-stack
  interval: 1m
  path: ./session-05-production/deploy/apps
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: ticketrush }
