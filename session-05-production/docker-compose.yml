services:
  postgres:
    image: postgres:18
    # pg_stat_statements = "which queries cost us the most?" — the first tool of the course
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
    ports:
      - "5442:5432"          # 5442 on the host — 5432 and 5440 are often taken
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # replication role + schema + ~1.6M seed rows on first start
    healthcheck:
      test: ["CMD-SHELL", "psql -U ticketrush -d ticketrush -tc 'select 1 from seed_done' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Session 5: a hot-standby replica. It copies the primary once (pg_basebackup), then follows its WAL stream.
  # The app sends every @Transactional(readOnly = true) here.
  postgres-replica:
    image: postgres:18
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/replica
      PGPASSWORD: replicator
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup -h postgres -U replicator -D "$$PGDATA" -R -X stream
          chmod 700 "$$PGDATA"
        fi
        exec postgres -c shared_preload_libraries=pg_stat_statements -c max_connections=200
    ports:
      - "5441:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -U ticketrush -d ticketrush -tc 'select pg_is_in_recovery()' | grep -q t"]
      interval: 3s
      timeout: 3s
      retries: 60

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"       # local demo only
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      # laptops with a >90% full Docker disk would otherwise refuse to allocate the index
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q -E 'green|yellow'"]
      interval: 3s
      timeout: 3s
      retries: 60

  kafka:
    image: apache/kafka:4.0.0          # KRaft — no ZooKeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST = the app on your machine (localhost:9092). A client must be able to reach the address a broker
      # ADVERTISES, so each network gets its own listener. (On Kubernetes the cluster runs its own Kafka.)
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9095:9090"          # 9090 is often taken
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the app runs on the host (Linux needs this line)

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticketrush.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"          # 3000 = Grafana in the kind cluster
    depends_on: [prometheus]
